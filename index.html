<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CA Tejas Andharia - HTML Utility Hub</title>

<style>
body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    margin: 0;
    background: linear-gradient(to right, #eef2f3, #dfe9f3);
}

/* HEADER */
.header {
    text-align: center;
    padding: 30px 20px;
}

.header img {
    width: 90px;
    border-radius: 12px;
}

.header h1 {
    margin: 10px 0 5px;
    color: #2c3e50;
}

.header p {
    color: #7f8c8d;
}

/* GRID */
.grid {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 25px;
    padding: 20px;
}

/* CARD */
.card {
    background: white;
    width: 300px;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 6px 12px rgba(0,0,0,0.1);
    transition: 0.3s;
}

.card:hover {
    transform: translateY(-8px);
}

.card h3 {
    color: #2980b9;
}

.card p {
    color: #7f8c8d;
}

/* BUTTON */
.btn {
    display: inline-block;
    padding: 10px 18px;
    border-radius: 6px;
    text-decoration: none;
    font-weight: bold;
    margin-top: 10px;
}

.active-btn {
    background: #3498db;
    color: white;
}

.locked-btn {
    background: #bdc3c7;
    color: white;
}

/* FOOTER */
footer {
    text-align: center;
    margin: 40px 0;
    color: #95a5a6;
    font-size: 0.85em;
}
</style>

</head>

<body>

<!-- HEADER -->
<div class="header">
    <img src="Picture1.png" alt="Logo">
    <h1>CA Tejas Andharia's HTML Utility Hub</h1>
    <p>Automation Tools for Finance, Taxation & General Utility</p>
</div>

<!-- TOOL GRID -->
<div class="grid" id="tools"></div>

<script>

/*
👉 HOW TO ADD NEW TOOL (VERY EASY)

Just copy below format and paste inside tools array:

{
    name: "Your Tool Name",
    description: "Short description",
    folder: "tools/your-folder-name/",
    status: "active"
}

*/

// 🔧 TOOL LIST (ONLY EDIT THIS)
const tools = [

    {
        name: "DatetoDay & Panchang Utility",
        description: "Calculate days from dates and view detailed Panchang information.",
        folder: "Tools/Date-to-Day with Panchang/",
        status: "active"
    },

    {
        name: "GST Tool (Coming Soon)",
        description: "GST automation utilities.",
        folder: "#",
        status: "locked"
    }

];


// 🚀 AUTO UI (DO NOT TOUCH)
const container = document.getElementById("tools");

tools.forEach(tool => {
    const card = document.createElement("div");
    card.className = "card";

    let button = '';

    if(tool.status === "active"){
        button = `<a href="${tool.folder}" class="btn active-btn">View App</a>`;
    } else {
        button = `<span class="btn locked-btn">Locked</span>`;
    }

    card.innerHTML = `
        <h3>${tool.name}</h3>
        <p>${tool.description}</p>
        ${button}
    `;

    container.appendChild(card);
});

</script>

<!-- FOOTER -->
<footer>
    Developed by CA Tejas Andharia, Bhavnagar (Gujarat) <br>
    F.C.A, B.Com, DISA, DIRM | AICA Level 1 Copilot Faculty
</footer>

</body>
</html>
